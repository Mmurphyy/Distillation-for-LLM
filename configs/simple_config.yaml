# 简化的基本配置
project_name: "knowledge-distillation-reasoning-simple"
random_seed: 42
output_dir: "outputs/simple"
log_dir: "outputs/logs"

# 数据配置
data:
  train_file: "data/ARC-Challenge-Train.jsonl"
  valid_file: "data/ARC-Challenge-Test.jsonl"
  num_workers: 2
  max_seq_length: 256
  batch_size: 1
  valid_batch_size: 2
  cache_dir: "data/cache"

# 模型配置
model:
  teacher_model: "/home/zp/.cache/modelscope/hub/models/Qwen/Qwen3-4B"
  student_model: "/home/zp/.cache/modelscope/hub/models/Qwen/Qwen3-0.6B"
  use_peft: true                                    # 是否使用PEFT
  lora_r: 8                                         # LoRA秩
  lora_alpha: 16                                    # LoRA缩放
  lora_dropout: 0.05                                # LoRA随机丢弃率
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]  # LoRA目标模块

# 训练配置
training:
  learning_rate: 1e-4
  weight_decay: 0.01
  max_grad_norm: 0.5
  num_train_epochs: 1
  warmup_ratio: 0.1
  gradient_accumulation_steps: 2
  fp16: true                    # 混合精度训练
  bf16: false                   # BF16训练 (优先于FP16)
  progressive_freezing: false   # 关闭渐进式冻结
  multi_task_weights:           # 多任务损失权重
    answer_prediction: 1.0
    reasoning_generation: 0.0   # 简化，关闭推理生成任务
  save_steps: 100
  eval_steps: 100
  logging_steps: 10

# 评估配置
evaluation:
  metrics: ["accuracy"]
  generate_explanations: false
  num_beams: 2
  max_new_tokens: 64

# 推理配置
inference:
  quantization: "int8"         # 量化策略：none, int8, int4
  batch_inference: false       # 关闭批量推理
  batch_size: 1                # 推理批大小
  device_map: "auto"           # 设备映射 